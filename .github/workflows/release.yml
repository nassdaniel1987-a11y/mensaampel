# Publishes the Dial device package and the offline demo as a GitHub release.
# Runs when the package changes on the development branch or main, or manually.
name: Release

on:
  push:
    branches: [main, claude/youthful-sagan-v8j6hx]
    paths:
      - Mensaampel_Dial_Vorbereitung.zip
      - Mensaampel_Tablet_Demo.html
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version Mensaampel_Dial_Vorbereitung/firmware/manifest.json)
          tag="v${version}"
          cat > notes.md <<NOTES
          ## Mensaampel ${version}

          **Dial einrichten:** \`Mensaampel_Dial_Vorbereitung.zip\` herunterladen, auf einem Windows-PC vollständig entpacken und \`ANLEITUNG-DIAL.html\` folgen (G0-Taste halten, USB-Datenkabel, \`Dial-Installieren.cmd\`).

          **Ausprobieren ohne Installation:** \`Mensaampel_Tablet_Demo.html\` herunterladen und im Browser öffnen, dann oben auf „Simulation“.

          Vorabversion: Die Software ist gebaut und automatisch getestet, aber noch nicht auf einem echten M5Stack Dial abgenommen. Firmware-Version ${version}, Quelle: Commit ${GITHUB_SHA}.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Mensaampel_Dial_Vorbereitung.zip Mensaampel_Tablet_Demo.html --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" Mensaampel_Dial_Vorbereitung.zip Mensaampel_Tablet_Demo.html \
              --title "Mensaampel ${version}" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          fi
